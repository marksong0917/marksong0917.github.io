<style>
  :root{--bg:#0a1120;--panel:#111c33;--line:#223354;--ink:#eef2fa;--muted:#93a1bd;--accent:#e85d1f}
  *{margin:0;padding:0;box-sizing:border-box}

  .box::before{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:420px;height:240px;background:radial-gradient(closest-side,rgba(232,93,31,.18),transparent 75%);pointer-events:none}
  .code{font-family:'JetBrains Mono',monospace;color:#7fe0ab;font-size:.9rem}
  h1{font-family:'Sora',sans-serif;font-size:2rem;letter-spacing:-.02em;margin:14px 0 10px}
  p{color:var(--muted)}
  .btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:12px 26px;border-radius:999px}
  .btn:hover{background:#c74e15}
  :focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
</style>
</head>
