<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="seal">词</span>
    <div>
      <h1 data-i18n="title">打字背单词</h1>
      <p data-i18n="tagline">一个字母一个字母敲，敲完就记住</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="voiceBtn" class="ghost-btn" type="button" title="Voice">🔊</button>
    <button id="langBtn" class="ghost-btn" type="button">EN</button>
  </div>
</header>

<main>
  <!-- Level shelf -->
  <section id="shelf">
    <p class="intro" data-i18n="intro">选一个词库，把每个单词亲手敲一遍。敲完会听到发音，看到中文意思和例句；打错的词最后会再来一轮，直到记住为止。</p>
    <div class="mode-tabs" role="group" aria-label="order">
      <button id="orderSeq" class="mode-tab active" type="button" data-i18n="orderSeq">顺序</button>
      <button id="orderRand" class="mode-tab" type="button" data-i18n="orderRand">随机</button>
    </div>
    <div id="shelfGrid" class="shelf-grid shelf-levels"></div>
  </section>

  <!-- Practice -->
  <section id="practice" hidden>
    <div class="reader-head">
      <button id="backBtn" class="ghost-btn" type="button">← <span data-i18n="back">词库</span></button>
      <div class="reader-title">
        <h2 id="pTitle"></h2>
        <p id="pPhase"></p>
      </div>
      <div class="reader-actions">
        <button id="restartBtn" class="ghost-btn" type="button" data-i18n="restart">重开本轮</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-num" id="stProgress">0/30</span><span class="stat-label" data-i18n="progress">进度</span></div>
      <div class="stat"><span class="stat-num" id="stAcc">100%</span><span class="stat-label" data-i18n="accuracy">正确率</span></div>
      <div class="stat"><span class="stat-num" id="stSpeed">0</span><span class="stat-label" data-i18n="speedUnit">字母/分钟</span></div>
      <div class="stat"><span class="stat-num" id="stTime">0:00</span><span class="stat-label" data-i18n="time">用时</span></div>
    </div>
    <div class="progress-track"><div id="progressBar"></div></div>

    <div id="wordCard" tabindex="0" aria-label="typing area">
      <div id="slots" class="slots"></div>
      <p id="phonetic" class="phonetic"></p>
      <div class="hint-row">
        <label class="hint-toggle"><input type="checkbox" id="hintToggle"> <span data-i18n="hint">提示（看中文意思）</span></label>
        <span id="meaning" class="meaning" hidden></span>
      </div>
      <div id="reveal" class="reveal" hidden>
        <p class="reveal-meaning" id="revealMeaning"></p>
        <p class="reveal-ex" id="revealEx"></p>
        <p class="reveal-exzh" id="revealExZh"></p>
        <button id="nextBtn" class="primary-btn" type="button" data-i18n="next">下一个</button>
      </div>
      <input id="mobileInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-hidden="true">
    </div>
    <p class="kbd-tip" data-i18n="kbdTip">点击单词卡后开始打字 · 请使用英文输入法</p>
  </section>

  <!-- Done overlay -->
  <div id="doneOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <span class="seal big">记</span>
      <h2 data-i18n="doneTitle">这一轮完成了</h2>
      <p id="doneLevelName" class="done-name"></p>
      <div class="done-stats">
        <div><strong id="dTime">0:00</strong><span data-i18n="time">用时</span></div>
        <div><strong id="dAcc">100%</strong><span data-i18n="accuracy">正确率</span></div>
        <div><strong id="dSpeed">0</strong><span data-i18n="speedUnit">字母/分钟</span></div>
        <div><strong id="dMastered">0</strong><span data-i18n="mastered">已掌握</span></div>
      </div>
      <p id="doneNote" class="done-note"></p>
      <div class="done-actions">
        <button id="againBtn" class="primary-btn" type="button" data-i18n="again">再来一轮</button>
        <button id="shelfBtn" class="ghost-btn" type="button" data-i18n="backToShelf">换词库</button>
      </div>
    </div>
  </div>
</main>
