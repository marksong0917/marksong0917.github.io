<body>
<header class="topbar">
  <div class="brand">
    <span class="seal">听</span>
    <div>
      <h1 data-i18n="title">听写助手</h1>
      <p data-i18n="tagline">听一听，写下来</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="langBtn" class="ghost-btn" type="button">EN</button>
  </div>
</header>

<main>
  <!-- Shelf -->
  <section id="shelf">
    <p class="intro" data-i18n="intro">选一个题库，点播放，仔细听，然后把听到的内容写下来。检查后逐字对照：对的变绿，错的标红并给出正确写法。中文按字对，英文不分大小写、不计标点。</p>
    <h2 class="section-title" data-i18n="setsTitle">选一个题库</h2>
    <div id="shelfGrid" class="shelf-grid"></div>
  </section>

  <!-- Player -->
  <section id="player-screen" hidden>
    <div class="reader-head">
      <button id="backBtn" class="ghost-btn" type="button">← <span data-i18n="back">题库</span></button>
      <div class="reader-title">
        <h2 id="setName"></h2>
        <p id="itemPos"></p>
      </div>
      <div class="head-spacer"></div>
    </div>

    <div id="stage">
      <div class="play-row">
        <button id="playBtn" class="play-btn" type="button">▶ <span data-i18n="play">播放</span></button>
        <button id="slowBtn" class="ghost-btn slow-btn" type="button">🐢 <span data-i18n="slow">慢速</span></button>
      </div>
      <div class="counters">
        <span><span data-i18n="plays">已播放</span> <strong id="playCount">0</strong> <span data-i18n="times">次</span></span>
        <span><span data-i18n="attempts">已尝试</span> <strong id="attemptCount">0</strong> <span data-i18n="times">次</span></span>
        <span id="scoreLine" class="score-line"></span>
      </div>

      <div class="input-row">
        <input id="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button id="checkBtn" class="primary-btn" type="button" data-i18n="check">检查</button>
      </div>

      <p id="feedback" class="feedback"></p>
      <div id="diff" class="diff"></div>
      <div id="info" class="info"></div>

      <div class="item-actions">
        <button id="revealBtn" class="ghost-btn" type="button" hidden data-i18n="reveal">显示答案</button>
        <button id="nextBtn" class="primary-btn" type="button" hidden data-i18n="next">下一题</button>
      </div>
    </div>
  </section>

  <!-- Summary -->
  <section id="summary" hidden>
    <div class="overlay-card summary-card">
      <span class="seal big">完</span>
      <h2 data-i18n="summaryTitle">本轮完成</h2>
      <p class="overall"><span data-i18n="overall">总得分</span> <strong id="overallScore">0%</strong></p>
      <h3 class="missed-title" data-i18n="missedTitle">需要再练的</h3>
      <div id="missedList" class="missed-list"></div>
      <div class="done-actions">
        <button id="againBtn" class="primary-btn" type="button" data-i18n="again">再练一轮</button>
        <button id="shelfBtn" class="ghost-btn" type="button" data-i18n="back">题库</button>
      </div>
    </div>
  </section>
</main>
