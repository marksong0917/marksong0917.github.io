    </div>

<main>
  <section class="card status">
    <div class="stat"><span class="stat-label" data-i18n="score">接龙长度</span><span class="stat-num" id="score">0</span></div>
    <div class="stat"><span class="stat-label" data-i18n="best">最佳纪录</span><span class="stat-num" id="best">0</span></div>
    <div class="stat"><span class="stat-label" data-i18n="need">下一字</span><span class="stat-num need" id="needChar">—</span></div>
    <div class="stat timer-stat" id="timerStat" hidden><span class="stat-label" data-i18n="timeLeft">剩余时间</span><span class="stat-num" id="timer">30</span></div>
  </section>

  <section class="card controls">
    <button id="startBtn" class="btn primary" type="button" data-i18n="start">开始游戏</button>
    <button id="hintBtn" class="btn" type="button" data-i18n="hint">提示</button>
    <button id="giveUpBtn" class="btn danger" type="button" data-i18n="giveUp">认输</button>
    <label class="timer-toggle"><input type="checkbox" id="timerToggle"> <span data-i18n="timer30">30 秒限时</span></label>
  </section>

  <p id="msg" class="msg" role="status"></p>
  <p id="hintBox" class="hint-box" hidden></p>

  <section class="card play">
    <div class="play-row">
      <input id="answer" type="text" maxlength="6" autocomplete="off"
             data-i18n-ph="placeholder" placeholder="输入成语…">
      <button id="submitBtn" class="btn primary" type="button" data-i18n="play">接龙</button>
    </div>
    <p class="rule" data-i18n="rule">规则：你接的成语，第一个字必须与上一个成语的最后一个字相同，不能重复。</p>
  </section>

  <section id="chain" class="chain" aria-live="polite"></section>
</main>
